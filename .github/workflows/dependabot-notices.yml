# Regenerates THIRD_PARTY_LICENSES on Dependabot pull requests.
#
# The CI job "THIRD_PARTY_LICENSES is current" (ci.yml, `notices`) fails whenever
# Cargo.lock changes, because the file lists every crate with its version, and
# Dependabot only edits Cargo.lock. This workflow rebuilds the file with the same
# script and cargo-about version as CI and the Dockerfile, and commits it to the
# Dependabot branch.
#
# Token: a commit pushed with GITHUB_TOKEN does not start new workflow runs, so the
# required checks would never run on the new head. The push therefore uses an
# installation token of the `vericto-publisher` GitHub App, minted per run from
# PUBLISHER_APP_ID and PUBLISHER_PRIVATE_KEY (Settings → Secrets and variables →
# Dependabot). The App holds Contents: read and write on this repository only. It
# replaced a fine-grained PAT, which GitHub caps at 366 days: the App's private key
# does not expire, so nothing has to be rotated on a calendar. Without those secrets
# the job fails with a clear message instead of pushing a commit CI would not check.
#
# Safety: runs only for dependabot[bot] on branches of this repository (never a
# fork), and only commits THIRD_PARTY_LICENSES.
name: Dependabot notices

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - third-party/**

permissions:
  contents: read

concurrency:
  group: dependabot-notices-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate THIRD_PARTY_LICENSES
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the App credentials
        env:
          PUBLISHER_APP_ID: ${{ secrets.PUBLISHER_APP_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
        run: |
          if [ -z "$PUBLISHER_APP_ID" ] || [ -z "$PUBLISHER_PRIVATE_KEY" ]; then
            echo "::error::Dependabot secrets PUBLISHER_APP_ID and PUBLISHER_PRIVATE_KEY are not both set; run 'sh third-party/build-notices.sh THIRD_PARTY_LICENSES' on this branch by hand."
            exit 1
          fi

      # Scoped to this repository, so the token cannot write anywhere else even if the
      # job is compromised. Expires an hour after the run.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88.0"

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Rebuild and commit
        run: |
          sh third-party/build-notices.sh THIRD_PARTY_LICENSES
          if git diff --quiet -- THIRD_PARTY_LICENSES; then
            echo "THIRD_PARTY_LICENSES is already current."
            exit 0
          fi
          # Authored as the maintainer account the CLA check exempts. The committer is
          # the App, but the author is what the CLA reads, and it accepts a bot author
          # only on a verified (signed) commit, which a plain git push cannot produce.
          git config user.name "Vericto"
          git config user.email "295450070+vericto@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES
          git commit -m "chore: regenerate THIRD_PARTY_LICENSES for ${GITHUB_HEAD_REF#dependabot/}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
